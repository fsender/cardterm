<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- 屏幕圆角剪裁 -->
    <clipPath id="screenClip">
      <rect x="200" y="55" width="400" height="225" rx="12" />
    </clipPath>
    <!-- 天空渐变 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF9A9E" />
      <stop offset="100%" stop-color="#FECFEF" />
    </linearGradient>
  </defs>

  <!-- 设备主体外壳 -->
  <rect x="60" y="40" width="680" height="420" rx="40" fill="#E5E8E8" stroke="#BDC3C7" stroke-width="4"/>
  
  <!-- 左侧贴纸与轮廓抽象区域 -->
  <g>
    <rect x="80" y="70" width="100" height="80" rx="10" fill="#D5D8DC"/>
    <rect x="90" y="80" width="80" height="30" rx="4" fill="#FFFFFF"/>
    <rect x="90" y="120" width="60" height="15" rx="3" fill="#BDC3C7"/>
    <rect x="80" y="180" width="100" height="35" rx="8" fill="#BDC3C7"/>
    <rect x="80" y="235" width="100" height="35" rx="8" fill="#BDC3C7"/>
  </g>

  <!-- 右侧电源与指示灯区域抽象 -->
  <g>
    <rect x="620" y="70" width="100" height="200" rx="10" fill="#D5D8DC"/>
    <rect x="640" y="90" width="35" height="55" rx="8" fill="#F1948A"/>
    <rect x="645" y="95" width="25" height="45" rx="5" fill="#E74C3C"/>
    <circle cx="680" cy="180" r="7" fill="#F4D03F"/>
    <circle cx="680" cy="205" r="7" fill="#58D68D"/>
    <rect x="620" y="290" width="100" height="35" rx="8" fill="#BDC3C7"/>
  </g>

  <!-- 屏幕区域 (16:9 比例) -->
  <g>
    <!-- 屏幕内容 (受剪裁) -->
    <g clip-path="url(#screenClip)">
      <!-- 1. 风景图背景 -->
      <!-- 天空 -->
      <rect x="200" y="55" width="400" height="225" fill="url(#skyGrad)" />
      <!-- 太阳 -->
      <circle cx="420" cy="120" r="35" fill="#FFD700" />
      <!-- 远山 -->
      <path d="M100,280 Q300,60 400,280 Z" fill="#8E44AD" opacity="0.6"/>
      <!-- 近山 -->
      <path d="M280,280 Q450,120 600,280 Z" fill="#3498DB" opacity="0.5"/>
      
      <!-- 2. 80% 透明度的黑色遮罩 -->
      <rect x="200" y="55" width="400" height="225" fill="#000000" opacity="0.8" />
      
      <!-- 3. 绿色终端符号 (左对齐) -->
      <g stroke="#66FF99" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <!-- 折线 > -->
        <polyline points="240,120 280,167.5 240,215" />
        <!-- 底边 _ -->
        <line x1="320" y1="215" x2="380" y2="215" />
      </g>
    </g>
    
    <!-- 屏幕边框 -->
    <rect x="200" y="55" width="400" height="225" rx="12" fill="none" stroke="#7F8C8D" stroke-width="2"/>
  </g>

  <!-- 键盘底板 -->
  <rect x="80" y="290" width="640" height="155" rx="20" fill="#D5D8DC" stroke="#BDC3C7" stroke-width="2"/>

  <!-- 键盘区域 (3行 x 8列) -->
  <g fill="#2C3E50">
    <!-- 行 1 -->
    <rect x="101" y="300" width="66" height="35" rx="17.5" />
    <rect x="177" y="300" width="66" height="35" rx="17.5" />
    <rect x="253" y="300" width="66" height="35" rx="17.5" />
    <rect x="329" y="300" width="66" height="35" rx="17.5" />
    <rect x="405" y="300" width="66" height="35" rx="17.5" />
    <rect x="481" y="300" width="66" height="35" rx="17.5" />
    <rect x="557" y="300" width="66" height="35" rx="17.5" />
    <rect x="633" y="300" width="66" height="35" rx="17.5" />

    <!-- 行 2 -->
    <rect x="101" y="350" width="66" height="35" rx="17.5" />
    <rect x="177" y="350" width="66" height="35" rx="17.5" />
    <rect x="253" y="350" width="66" height="35" rx="17.5" />
    <rect x="329" y="350" width="66" height="35" rx="17.5" />
    <rect x="405" y="350" width="66" height="35" rx="17.5" />
    <rect x="481" y="350" width="66" height="35" rx="17.5" />
    <rect x="557" y="350" width="66" height="35" rx="17.5" />
    <rect x="633" y="350" width="66" height="35" rx="17.5" />

    <!-- 行 3 -->
    <rect x="101" y="400" width="66" height="35" rx="17.5" />
    <rect x="177" y="400" width="66" height="35" rx="17.5" />
    <rect x="253" y="400" width="66" height="35" rx="17.5" />
    <rect x="329" y="400" width="66" height="35" rx="17.5" />
    <rect x="405" y="400" width="66" height="35" rx="17.5" />
    <rect x="481" y="400" width="66" height="35" rx="17.5" />
    <rect x="557" y="400" width="66" height="35" rx="17.5" />
    <rect x="633" y="400" width="66" height="35" rx="17.5" />
  </g>

  <!-- 键盘按键颜色点缀 (左侧第一列) -->
  <rect x="101" y="300" width="16" height="35" rx="8" fill="#3498DB"/>
  <rect x="101" y="350" width="16" height="35" rx="8" fill="#E91E63"/>
  <rect x="101" y="400" width="16" height="35" rx="8" fill="#F1C40F"/>
</svg>